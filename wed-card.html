<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>禮車車卡｜好好禮車</title>
<style>
:root{--bg:#f8f5f0;--surface:#fff;--fg:#2f2a24;--muted:#7a7066;--line:#e4dbce;--accent:#8a6d43;--accent-ink:#fff;--warn:#b4532a;--warn-soft:#fbeee6;--ok:#2f7d4f;--ok-soft:#e8f4ec}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--surface:#26221e;--fg:#f1ebe3;--muted:#b3a899;--line:#3b352e;--accent:#c9a46b;--accent-ink:#1d1a17;--warn:#f0a07a;--warn-soft:#3a2a22;--ok:#7fc79a;--ok-soft:#1f3328}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}
.brand{color:var(--accent);font-weight:700;letter-spacing:.08em;font-size:15px}
h1{font-size:24px;margin:2px 0 4px}
.lead{color:var(--muted);margin:0 0 18px;font-size:15px}
form{display:grid;gap:16px}
.field{display:grid;gap:6px}
label{font-weight:600}
label small{font-weight:400;color:var(--muted);margin-left:6px}
input{font:inherit;font-size:18px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
input[readonly]{background:transparent;color:var(--muted)}
input.bad{border-color:var(--warn);background:var(--warn-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:38px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.err{color:var(--warn);font-size:14px;min-height:0}
.hint{font-size:15px;color:var(--ok);min-height:0}
.hint.warn{color:var(--warn)}
.sec{font-weight:700;font-size:18px;border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
.sec small{display:block;font-weight:400;font-size:14px;color:var(--muted)}
button.go{font:inherit;font-weight:700;font-size:18px;color:var(--accent-ink);background:var(--accent);border:0;border-radius:12px;min-height:52px;width:100%;cursor:pointer;margin-top:4px}
button.go:disabled{opacity:.6}
.note{border-radius:12px;padding:14px 16px;white-space:pre-line}
#ownLine{white-space:normal}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.state{text-align:center;color:var(--muted);padding:48px 0}
.done{text-align:center;padding:36px 0}
.done .big{font-size:52px;line-height:1}
.done h2{margin:10px 0 6px}
.done p{color:var(--muted);margin:0 0 20px;white-space:pre-line}
.drow,.ditem{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.drow .lb,.ditem .lb{flex:1;font-weight:600}
.drow .st,.ditem .st{font-size:14px;color:var(--muted)}
.drow .st.ok,.ditem .st.ok{color:var(--ok)}
.pick{font:inherit;font-size:15px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 14px;min-height:38px;cursor:pointer;white-space:nowrap}
.pick:disabled{opacity:.5}
.del{font:inherit;font-size:14px;border:0;background:transparent;color:var(--warn);cursor:pointer;padding:6px}
.dist{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--surface)}
.dist b{display:block;margin-bottom:6px;font-size:15px}
.dist .chip{font-size:14px;padding:4px 11px;min-height:34px}
.ck{display:flex;gap:8px;align-items:center;font-weight:400;margin:6px 0}
.ck input{width:22px;height:22px;min-height:0}
.dates{display:grid;gap:10px}
.dates label{display:grid;gap:4px}
.dates small{font-weight:400;color:var(--muted)}
.tnote{color:var(--muted);font-size:13px;margin:10px 0 0}
button.go.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:10px}
#docs .sec{margin-top:18px}
[hidden]{display:none!important}
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
</head>
<body>
<div class="wrap">
  <div class="brand">好好禮車 禮車助手</div>
  <h1 id="title">填寫禮車車卡</h1>
  <p class="lead" id="lead">填好按送出就完成綁定，之後派車不用再填資料。</p>
  <div class="note warn" id="ownLine" style="margin:0 0 16px">⚠️ 請用<b>駕駛本人</b>的 LINE 開啟並填寫。<br>這個 LINE 會綁定成司機帳號，之後的派車通知都會傳到這裡，請不要用家人或車行的 LINE 代填。</div>

  <div class="state" id="loading">讀取中…</div>
  <div class="note warn" id="fatal" hidden></div>

  <form id="f" hidden novalidate>
    <div class="field">
      <label for="name">姓名<small>請填本名（駕照上的全名）</small></label>
      <input id="name" autocomplete="name" maxlength="20" placeholder="例：王聰明" required>
      <div class="err" id="e-name"></div>
    </div>
    <div class="field">
      <label for="phone">手機號碼</label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="12" placeholder="09xxxxxxxx" required>
      <div class="err" id="e-phone"></div>
    </div>
    <div class="field">
      <label>居住地區<small>縣市可複選，選了縣市再選地區</small></label>
      <div class="chips" id="cityChips"></div>
      <div id="distBox"></div>
      <div class="err" id="e-area"></div>
    </div>
    <div class="field">
      <label>生肖</label>
      <div class="chips" id="zodiacChips"></div>
      <div class="err" id="e-zodiac"></div>
    </div>
    <div class="sec">車輛資料</div>
    <div class="field">
      <label for="plate">車牌<small>例：RED-7380</small></label>
      <input id="plate" autocapitalize="characters" maxlength="10" required>
      <div class="err" id="e-plate"></div>
    </div>
    <div class="field">
      <label>廠牌</label>
      <div class="chips" id="brandChips">
        <button type="button" class="chip">Tesla</button><button type="button" class="chip">Benz</button><button type="button" class="chip">BMW</button><button type="button" class="chip">Maserati</button><button type="button" class="chip">Porsche</button><button type="button" class="chip">Bentley</button><button type="button" class="chip">Rolls-Royce</button><button type="button" class="chip">Lexus</button><button type="button" class="chip">Toyota</button><button type="button" class="chip">其他</button>
      </div>
      <input id="brandOther" maxlength="15" placeholder="其他進口車廠牌（例：Volvo）" hidden>
      <div class="err" id="e-brand"></div>
    </div>
    <div class="field">
      <label for="model">車款</label>
      <div class="chips" id="modelChips" hidden></div>
      <input id="model" maxlength="25" placeholder="其他車款請直接輸入" required>
      <div class="err" id="e-model"></div>
    </div>
    <div class="field">
      <label for="seats">座位數<small>含司機</small></label>
      <div class="chips" data-for="seats">
        <button type="button" class="chip">5</button><button type="button" class="chip">6</button><button type="button" class="chip">7</button><button type="button" class="chip">9</button>
      </div>
      <input id="seats" type="number" inputmode="numeric" min="2" max="19" placeholder="例：5" required>
      <div class="err" id="e-seats"></div>
    </div>
    <div class="field">
      <label for="color">車色</label>
      <div class="chips" data-for="color"><button type="button" class="chip">黑色</button><button type="button" class="chip">白色</button><button type="button" class="chip">紅色</button></div>
      <input id="color" maxlength="10" placeholder="其他顏色請直接輸入" required>
      <div class="err" id="e-color"></div>
    </div>
    <div class="field">
      <label>包膜</label>
      <div class="chips yn" data-yn="wrap"><button type="button" class="chip">有</button><button type="button" class="chip">無</button></div>
      <input id="wrapNote" maxlength="60" placeholder="說明包膜顏色、材質，例：消光黑、TPU 犀牛皮" hidden>
      <div class="err" id="e-wrap"></div>
    </div>
    <div class="field">
      <label>改裝</label>
      <div class="chips yn" data-yn="mod"><button type="button" class="chip">有</button><button type="button" class="chip">無</button></div>
      <input id="modNote" maxlength="60" placeholder="說明改裝項目，例：改輪框、降低車身" hidden>
      <div class="err" id="e-mod"></div>
    </div>
    <div class="sec">緊急聯絡人<small>只有在禮車出發時間沒有回報、聯絡不到你時才會用到，平時不會聯絡</small></div>
    <div class="field">
      <label for="emName">稱呼</label>
      <input id="emName" maxlength="20" placeholder="例：王太太、陳先生" required>
      <div class="err" id="e-emName"></div>
    </div>
    <div class="field">
      <label for="emPhone">電話</label>
      <input id="emPhone" type="tel" inputmode="numeric" maxlength="12" placeholder="09xxxxxxxx" required>
      <div class="err" id="e-emPhone"></div>
    </div>
    <div class="field">
      <label for="emRel">關係</label>
      <div class="chips" data-for="emRel"><button type="button" class="chip">配偶</button><button type="button" class="chip">父母</button><button type="button" class="chip">兄弟姊妹</button><button type="button" class="chip">朋友</button></div>
      <input id="emRel" maxlength="10" placeholder="點上面選，或自己填" required>
      <div class="err" id="e-emRel"></div>
    </div>
    <div class="sec">車輛外觀照片<small>1～3 張，拍得到車頭和車牌</small></div>
    <div id="photos"></div>
    <div class="err" id="e-photos"></div>
    <div class="sec">保險單<small>需包含強制險及任意險，照片或 PDF，最多 5 個檔案</small></div>
    <div id="insBox"></div>
    <div class="err" id="e-ins"></div>
    <div class="note warn" id="srvErr" hidden></div>
    <button type="submit" class="go" id="go">送出車卡</button>
    <p class="tnote">資料只給好好禮車派車使用。</p>
  </form>

  <div class="done" id="done" hidden>
    <div class="big">✅</div>
    <h2 id="doneTitle">綁定完成</h2>
    <p id="doneMsg"></p>
    <button type="button" class="go ghost" id="close">回到聊天室</button>
  </div>
</div>
<script>
(function(){
  var BOT = 'https://script.google.com/macros/s/AKfycbwoKk13j5YOtkA5cTh3FtvECekYm0uMBPsid1H--kB7bhUVpDFvSnSA0iTzCfc8IT11_Q/exec';
  var LIFF_ID = '2011949076-1fqUEtE2';
  var $ = function(id){ return document.getElementById(id); };
  var idToken = '', disp = '', bound = false, goLabel = '送出車卡', photos = [], ins = [], busy = false;
  var FIELDS = ['name','phone','plate','model','seats','color','emName','emPhone','emRel'];
  var ZOD = ['鼠','牛','虎','兔','龍','蛇','馬','羊','猴','雞','狗','豬'], zodiac = '', yn = { wrap: null, mod: null };

  function fatal(msg){ $('loading').hidden = true; $('f').hidden = true; $('fatal').hidden = false; $('fatal').textContent = msg; }
  function post(body){
    return fetch(BOT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  }
  function val(id){ return $(id).value.trim(); }

  // 居住地區：縣市複選 → 每個縣市再選地區（可複選）
  var TW = {"台北市":["中正區","大同區","中山區","松山區","大安區","萬華區","信義區","士林區","北投區","內湖區","南港區","文山區"],"新北市":["板橋區","三重區","中和區","永和區","新莊區","新店區","樹林區","鶯歌區","三峽區","淡水區","汐止區","瑞芳區","土城區","蘆洲區","五股區","泰山區","林口區","深坑區","石碇區","坪林區","三芝區","石門區","八里區","平溪區","雙溪區","貢寮區","金山區","萬里區","烏來區"],"基隆市":["仁愛區","信義區","中正區","中山區","安樂區","暖暖區","七堵區"],"桃園市":["桃園區","中壢區","平鎮區","八德區","楊梅區","蘆竹區","大溪區","龍潭區","龜山區","大園區","觀音區","新屋區","復興區"],"新竹市":["東區","北區","香山區"],"新竹縣":["竹北市","竹東鎮","新埔鎮","關西鎮","湖口鄉","新豐鄉","芎林鄉","橫山鄉","北埔鄉","寶山鄉","峨眉鄉","尖石鄉","五峰鄉"],"苗栗縣":["苗栗市","頭份市","竹南鎮","後龍鎮","通霄鎮","苑裡鎮","卓蘭鎮","造橋鄉","西湖鄉","頭屋鄉","公館鄉","銅鑼鄉","三義鄉","大湖鄉","獅潭鄉","三灣鄉","南庄鄉","泰安鄉"],"台中市":["中區","東區","南區","西區","北區","北屯區","西屯區","南屯區","太平區","大里區","霧峰區","烏日區","豐原區","后里區","石岡區","東勢區","和平區","新社區","潭子區","大雅區","神岡區","大肚區","沙鹿區","龍井區","梧棲區","清水區","大甲區","外埔區","大安區"],"彰化縣":["彰化市","員林市","和美鎮","鹿港鎮","溪湖鎮","二林鎮","田中鎮","北斗鎮","花壇鄉","芬園鄉","大村鄉","永靖鄉","伸港鄉","線西鄉","福興鄉","秀水鄉","埔心鄉","埔鹽鄉","大城鄉","芳苑鄉","竹塘鄉","社頭鄉","二水鄉","田尾鄉","埤頭鄉","溪州鄉"],"南投縣":["南投市","埔里鎮","草屯鎮","竹山鎮","集集鎮","名間鄉","鹿谷鄉","中寮鄉","魚池鄉","國姓鄉","水里鄉","信義鄉","仁愛鄉"],"雲林縣":["斗六市","斗南鎮","虎尾鎮","西螺鎮","土庫鎮","北港鎮","古坑鄉","大埤鄉","莿桐鄉","林內鄉","二崙鄉","崙背鄉","麥寮鄉","東勢鄉","褒忠鄉","台西鄉","元長鄉","四湖鄉","口湖鄉","水林鄉"],"嘉義市":["東區","西區"],"嘉義縣":["太保市","朴子市","布袋鎮","大林鎮","民雄鄉","溪口鄉","新港鄉","六腳鄉","東石鄉","義竹鄉","鹿草鄉","水上鄉","中埔鄉","竹崎鄉","梅山鄉","番路鄉","大埔鄉","阿里山鄉"],"台南市":["中西區","東區","南區","北區","安平區","安南區","永康區","歸仁區","新化區","左鎮區","玉井區","楠西區","南化區","仁德區","關廟區","龍崎區","官田區","麻豆區","佳里區","西港區","七股區","將軍區","學甲區","北門區","新營區","後壁區","白河區","東山區","六甲區","下營區","柳營區","鹽水區","善化區","大內區","山上區","新市區","安定區"],"高雄市":["新興區","前金區","苓雅區","鹽埕區","鼓山區","旗津區","前鎮區","三民區","楠梓區","小港區","左營區","仁武區","大社區","岡山區","路竹區","阿蓮區","田寮區","燕巢區","橋頭區","梓官區","彌陀區","永安區","湖內區","鳳山區","大寮區","林園區","鳥松區","大樹區","旗山區","美濃區","六龜區","內門區","杉林區","甲仙區","桃源區","那瑪夏區","茂林區","茄萣區"],"屏東縣":["屏東市","潮州鎮","東港鎮","恆春鎮","萬丹鄉","長治鄉","麟洛鄉","九如鄉","里港鄉","鹽埔鄉","高樹鄉","萬巒鄉","內埔鄉","竹田鄉","新埤鄉","枋寮鄉","新園鄉","崁頂鄉","林邊鄉","南州鄉","佳冬鄉","琉球鄉","車城鄉","滿州鄉","枋山鄉","三地門鄉","霧台鄉","瑪家鄉","泰武鄉","來義鄉","春日鄉","獅子鄉","牡丹鄉"],"宜蘭縣":["宜蘭市","羅東鎮","蘇澳鎮","頭城鎮","礁溪鄉","壯圍鄉","員山鄉","冬山鄉","五結鄉","三星鄉","大同鄉","南澳鄉"],"花蓮縣":["花蓮市","鳳林鎮","玉里鎮","新城鄉","吉安鄉","壽豐鄉","光復鄉","豐濱鄉","瑞穗鄉","富里鄉","秀林鄉","萬榮鄉","卓溪鄉"],"台東縣":["台東市","成功鎮","關山鎮","卑南鄉","鹿野鄉","池上鄉","東河鄉","長濱鄉","太麻里鄉","大武鄉","綠島鄉","海端鄉","延平鄉","金峰鄉","達仁鄉","蘭嶼鄉"],"澎湖縣":["馬公市","湖西鄉","白沙鄉","西嶼鄉","望安鄉","七美鄉"],"金門縣":["金城鎮","金湖鎮","金沙鎮","金寧鄉","烈嶼鄉","烏坵鄉"],"連江縣":["南竿鄉","北竿鄉","莒光鄉","東引鄉"]};
  var area = {};  // 縣市 → [地區]
  $('cityChips').innerHTML = Object.keys(TW).map(function(c){ return '<button type="button" class="chip">' + c + '</button>'; }).join('');
  function renderArea(){
    $('cityChips').querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', String(!!area[c.textContent])); });
    $('distBox').innerHTML = Object.keys(TW).filter(function(c){ return area[c]; }).map(function(c){
      return '<div class="dist" data-city="' + c + '"><b>' + c + '：選地區（可複選）</b><div class="chips">' + TW[c].map(function(d){ return '<button type="button" class="chip" aria-pressed="' + (area[c].indexOf(d) >= 0) + '">' + d + '</button>'; }).join('') + '</div></div>';
    }).join('');
  }
  $('cityChips').addEventListener('click', function(e){ var c = e.target.closest('.chip'); if (!c) return; var k = c.textContent; if (area[k]) delete area[k]; else area[k] = []; $('e-area').textContent = ''; renderArea(); });
  $('distBox').addEventListener('click', function(e){
    var c = e.target.closest('.chip'), box = e.target.closest('[data-city]'); if (!c || !box) return;
    var L = area[box.getAttribute('data-city')], d = c.textContent, i = L.indexOf(d);
    if (i >= 0) L.splice(i, 1); else L.push(d);
    c.setAttribute('aria-pressed', String(i < 0)); $('e-area').textContent = '';
  });
  function areaText(){ return Object.keys(TW).filter(function(c){ return area[c]; }).map(function(c){ var o = TW[c]; return c + '（' + area[c].slice().sort(function(a, b){ return o.indexOf(a) - o.indexOf(b); }).join('、') + '）'; }).join('；'); }
  function areaLoad(t){
    area = {};
    String(t || '').split(/[；;]/).forEach(function(p){ var m = p.trim().match(/^(.{3})(?:（(.*)）)?$/); if (!m || !TW[m[1]]) return; area[m[1]] = (m[2] || '').split('、').filter(function(d){ return TW[m[1]].indexOf(d) >= 0; }); });
    renderArea();
  }

  // 生肖
  $('zodiacChips').innerHTML = ZOD.map(function(z){ return '<button type="button" class="chip">' + z + '</button>'; }).join('');
  function setZodiac(z){ zodiac = z; $('zodiacChips').querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', String(c.textContent === z)); }); $('e-zodiac').textContent = ''; }
  $('zodiacChips').addEventListener('click', function(e){ var c = e.target.closest('.chip'); if (c) setZodiac(c.textContent); });

  // 廠牌
  var brand = '';
  function setBrand(b){
    brand = b;
    $('brandChips').querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', String(c.textContent === b)); });
    $('brandOther').hidden = b !== '其他'; $('e-brand').textContent = ''; $('brandOther').classList.remove('bad');
    modelSync();
  }
  $('brandChips').addEventListener('click', function(e){ var c = e.target.closest('.chip'); if (!c) return; $('model').value = ''; modelPick = ''; setBrand(c.textContent); if (brand === '其他') $('brandOther').focus(); });
  $('brandOther').addEventListener('input', function(){ $('e-brand').textContent = ''; $('brandOther').classList.remove('bad'); });
  function brandText(){ return brand === '其他' ? val('brandOther') : brand; }
  // 車款：官網有標價的車款用按鈕選，沒有的選「其他」自己填
  var MODEL_OPTS = {"Tesla": ["Model X", "Model S", "Model Y", "Model 3"], "Benz": ["W205", "W212(改)", "W213", "W222(2013-2018)", "W222(改)(2018-2020)", "W223", "VITO", "G Car"], "BMW": ["F30", "F10", "F02", "G12", "G12(改)"], "Maserati": ["Ghibli", "Levante"], "Porsche": ["Panamera", "Macan"], "Bentley": ["舊款(2017)", "新款"], "Rolls-Royce": ["Ghost 古斯特", "Phantom 幻影"], "Lexus": ["LM 300h"], "Toyota": ["Alphard"]}, modelPick = '';
  function modelSync(){
    var box = $('modelChips'), inp = $('model'), L = MODEL_OPTS[brand] || [], v = inp.value.trim();
    if (!L.length){ box.hidden = true; inp.hidden = false; modelPick = ''; return; }
    if (modelPick !== '其他') modelPick = L.indexOf(v) >= 0 ? v : (v ? '其他' : '');
    box.hidden = false;
    box.innerHTML = L.concat(['其他']).map(function(m){ return '<button type="button" class="chip" aria-pressed="' + (m === modelPick) + '">' + m + '</button>'; }).join('');
    inp.hidden = modelPick !== '其他';
  }
  $('modelChips').addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if (!c) return; var inp = $('model');
    inp.classList.remove('bad'); $('e-model').textContent = '';
    if (c.textContent === '其他'){ modelPick = '其他'; inp.value = ''; modelSync(); inp.focus(); }
    else { modelPick = c.textContent; inp.value = c.textContent; modelSync(); }
  });


  // 包膜／改裝 有無
  function setYn(k, v){
    yn[k] = v; var box = document.querySelector('[data-yn="' + k + '"]');
    box.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', String((c.textContent === '有') === v && v !== null)); });
    $(k + 'Note').hidden = v !== true; $('e-' + k).textContent = '';
  }
  document.querySelectorAll('[data-yn]').forEach(function(box){
    box.addEventListener('click', function(e){ var c = e.target.closest('.chip'); if (!c) return; var k = box.getAttribute('data-yn'); setYn(k, c.textContent === '有'); if (yn[k]) $(k + 'Note').focus(); });
  });

  // 座位數快速選項
  document.querySelectorAll('.chips[data-for]').forEach(function(box){
    var input = $(box.getAttribute('data-for'));
    function sync(){ box.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', String(c.textContent === input.value.trim())); }); }
    box.addEventListener('click', function(e){
      var c = e.target.closest('.chip'); if (!c) return;
      input.value = (c.getAttribute('aria-pressed') === 'true') ? '' : c.textContent;
      input.classList.remove('bad'); $('e-' + input.id).textContent = ''; sync();
    });
    input.addEventListener('input', sync); input._sync = sync;
  });
  FIELDS.forEach(function(k){ $(k).addEventListener('input', function(){ $(k).classList.remove('bad'); $('e-' + k).textContent = ''; }); });
  $('plate').addEventListener('blur', function(){ $('plate').value = $('plate').value.toUpperCase(); });

  // 外觀照片
  function md(t){ var d = new Date(+t); return (d.getMonth() + 1) + '/' + d.getDate(); }
  function renderPhotos(){
    $('photos').innerHTML = photos.map(function(p, i){ return '<div class="ditem"><span class="lb">外觀照片 ' + (i + 1) + '</span><span class="st ok">✓ ' + md(p.at) + '</span><button type="button" class="del" data-del="' + p.id + '">刪除</button></div>'; }).join('') +
      (photos.length < 3 ? '<div class="ditem"><span class="lb">' + (photos.length ? '再加一張' : '外觀照片') + '</span><span class="st">' + photos.length + ' / 3</span><label class="pick"><input type="file" accept="image/*" data-up="car" hidden>拍照／選照片</label></div>' : '');
    if (photos.length) $('e-photos').textContent = '';
    $('insBox').innerHTML = ins.map(function(p, i){ return '<div class="ditem"><span class="lb">保險單 ' + (i + 1) + '</span><span class="st ok">✓ ' + md(p.at) + '</span><button type="button" class="del" data-del="' + p.id + '" data-kind="ins">刪除</button></div>'; }).join('') +
      (ins.length < 5 ? '<div class="ditem"><span class="lb">' + (ins.length ? '再加一個' : '保險單') + '</span><span class="st">' + ins.length + ' / 5</span><label class="pick"><input type="file" accept="image/*,application/pdf" data-up="ins" hidden>拍照／選檔</label></div>' : '');
    if (ins.length) $('e-ins').textContent = '';
  }
  function setFiles(j){ photos = j.photos || []; ins = j.ins || []; renderPhotos(); }
  function shrink(file){
    return new Promise(function(res){
      if (!/^image\//.test(file.type) || /heic|heif/i.test(file.type)) return res(file);
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function(){ var M = 1800, w = img.naturalWidth, h = img.naturalHeight, r = Math.min(1, M / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * r); c.height = Math.round(h * r); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); c.toBlob(function(b){ res(b && b.size < file.size ? b : file); }, 'image/jpeg', 0.82); };
      img.onerror = function(){ URL.revokeObjectURL(url); res(file); };
      img.src = url;
    });
  }
  function b64(blob){ return new Promise(function(res, rej){ var fr = new FileReader(); fr.onload = function(){ res(String(fr.result).split(',')[1] || ''); }; fr.onerror = rej; fr.readAsDataURL(blob); }); }
  document.addEventListener('change', function(e){
    if (!e.target.getAttribute || !e.target.getAttribute('data-up') || !e.target.files || !e.target.files[0]) return;
    var file = e.target.files[0], kind = e.target.getAttribute('data-up'), errEl = $(kind === 'ins' ? 'e-ins' : 'e-photos'); e.target.value = '';
    if (busy) return; busy = true; errEl.textContent = '';
    var lab = e.target.parentNode; lab.lastChild.textContent = '上傳中…';
    shrink(file).then(function(b){ if (b.size > 9 * 1024 * 1024) throw new Error('檔案太大（超過 9MB），請改用相機拍照');
      var mime = b.type || file.type || 'image/jpeg'; return b64(b).then(function(s){ return post({ action: 'wedLiff', op: 'upload', kind: kind, idToken: idToken, disp: disp, name: val('name'), mime: mime, b64: s }); }); })
      .then(function(j){ if (!j || !j.ok) throw new Error((j && j.error) || '上傳失敗，請再試一次'); setFiles(j); })
      .catch(function(err){ errEl.textContent = err.message || String(err); lab.lastChild.textContent = '再試一次'; })
      .then(function(){ busy = false; });
  });
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('[data-del]'); if (!b || busy) return;
    busy = true; b.textContent = '刪除中…';
    post({ action: 'wedLiff', op: 'photodel', idToken: idToken, id: b.getAttribute('data-del'), kind: b.getAttribute('data-kind') || 'car' })
      .then(function(j){ if (!j || !j.ok) throw new Error((j && j.error) || '刪除失敗'); setFiles(j); })
      .catch(function(err){ $('e-photos').textContent = err.message || String(err); }).then(function(){ busy = false; });
  });

  function check(){
    var errs = {}, phone = val('phone').replace(/[^0-9]/g, '');
    if (!val('name')) errs.name = '請填本名';
    else if (!/^[一-龥·．]{2,6}$|^[A-Za-z][A-Za-z.'-]*(\s+[A-Za-z][A-Za-z.'-]*)+$/.test(val('name')) || /^[小阿老][一-龥]$/.test(val('name'))) errs.name = '請填本名（駕照上的全名），不要填暱稱';
    if (!/^09\d{8}$/.test(phone)) errs.phone = '請填 10 碼手機號碼（09 開頭）';
    var cs = Object.keys(area);
    if (!cs.length) errs.area = '請選居住縣市';
    else { var no = cs.filter(function(c){ return !area[c].length; }); if (no.length) errs.area = '請選 ' + no.join('、') + ' 的地區'; }
    if (!zodiac) errs.zodiac = '請選生肖';
    if (val('plate').replace(/[^A-Za-z0-9]/g, '').length < 4) errs.plate = '請填完整車牌';
    if (!brand) errs.brand = '請選廠牌';
    else if (brand === '其他' && !val('brandOther')) { errs.brand = '請填其他進口車廠牌'; $('brandOther').classList.add('bad'); }
    if (!val('model')) errs.model = modelPick === '其他' || !(MODEL_OPTS[brand] || []).length ? '請填車款' : '請選車款';
    if (!/^([2-9]|1[0-9])$/.test(val('seats'))) errs.seats = '請填 2～19 的數字';
    if (!val('color')) errs.color = '請填車色';
    if (!val('emName')) errs.emName = '請填緊急聯絡人稱呼';
    var emp = val('emPhone').replace(/[^0-9]/g, '');
    if (!/^0\d{8,9}$/.test(emp)) errs.emPhone = '請填緊急聯絡人電話';
    else if (emp === phone) errs.emPhone = '請填別人的電話，不要填自己的';
    if (!val('emRel')) errs.emRel = '請選或填關係';
    if (yn.wrap === null) errs.wrap = '請選有沒有包膜'; else if (yn.wrap && !val('wrapNote')) errs.wrap = '請簡單說明包膜內容';
    if (yn.mod === null) errs.mod = '請選有沒有改裝'; else if (yn.mod && !val('modNote')) errs.mod = '請簡單說明改裝內容';
    if (!photos.length) errs.photos = '請至少上傳 1 張車輛外觀照片';
    if (!ins.length) errs.ins = '請上傳保險單（需包含強制險及任意險）';
    FIELDS.forEach(function(k){ $(k).classList.toggle('bad', !!errs[k]); $('e-' + k).textContent = errs[k] || ''; });
    ['area','zodiac','brand','wrap','mod','photos','ins'].forEach(function(k){ $('e-' + k).textContent = errs[k] || ''; });
    var first = Object.keys(errs)[0];
    if (first){ var el = FIELDS.indexOf(first) >= 0 ? $(first) : $('e-' + first); if (FIELDS.indexOf(first) >= 0) el.focus(); el.scrollIntoView({ block: 'center' }); }
    return !first;
  }

  $('f').addEventListener('submit', function(e){
    e.preventDefault(); $('srvErr').hidden = true;
    if (busy){ $('srvErr').hidden = false; $('srvErr').textContent = '檔案還在上傳，請稍等'; return; }
    if (!check()) return;
    $('go').disabled = true; $('go').textContent = '送出中…';
    post({ action: 'wedLiff', op: 'save', idToken: idToken, disp: disp,
      card: { name: val('name'), phone: val('phone'), area: areaText(), zodiac: zodiac, plate: val('plate').toUpperCase(), brand: brandText(), model: val('model'), seats: val('seats'), color: val('color'),
        wrap: yn.wrap, wrapNote: val('wrapNote'), mod: yn.mod, modNote: val('modNote'), emName: val('emName'), emPhone: val('emPhone'), emRel: val('emRel') } })
      .then(function(j){
        if (!j || !j.ok) throw new Error((j && j.error) || '送出失敗，請再試一次');
        if (!j.done){ $('srvErr').hidden = false; $('srvErr').textContent = j.msg || '資料有誤，請檢查後再送出'; return; }
        $('f').hidden = true; $('done').hidden = false; $('ownLine').hidden = true;
        $('doneTitle').textContent = bound ? '車卡已更新' : '綁定完成';
        $('doneMsg').textContent = bound ? '資料已更新，謝謝！' : '謝謝！之後派車不用再填資料。\n車子或電話有變，再打開這個表單修改就好。';
        try { if (liff.isInClient()) liff.sendMessages([{ type: 'text', text: bound ? '✅ 禮車車卡已更新' : '✅ 禮車車卡已送出' }]).catch(function(){}); } catch (x) {}
      })
      .catch(function(err){ $('srvErr').hidden = false; $('srvErr').textContent = err.message || String(err); })
      .then(function(){ $('go').disabled = false; $('go').textContent = goLabel; });
  });
  $('close').addEventListener('click', function(){ try { liff.closeWindow(); } catch (x) {} });

  // 舊車款字串拆回廠牌
  var BRANDS = ['Tesla','Benz','BMW','Maserati','Porsche','Bentley','Rolls-Royce','Lexus','Toyota'];
  liff.init({ liffId: LIFF_ID }).then(function(){
    if (!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return null; }
    idToken = liff.getIDToken() || '';
    return liff.getProfile().then(function(p){ disp = p.displayName || ''; }, function(){}).then(function(){ return post({ action: 'wedLiff', op: 'load', idToken: idToken }); });
  }).then(function(j){
    if (j === null) return;
    if (!j || !j.ok) throw new Error((j && j.error) || '讀取失敗，請關掉後重新開啟');
    bound = !!j.bound; photos = j.photos || []; ins = j.ins || [];
    var c = j.card;
    if (c){
      ['name','phone','plate','model','seats','color','emName','emPhone','emRel'].forEach(function(k){ $(k).value = c[k] || ''; if ($(k)._sync) $(k)._sync(); });
      areaLoad(c.area);
      if (c.zodiac) setZodiac(c.zodiac);
      if (c.brand){ if (BRANDS.indexOf(c.brand) >= 0) setBrand(c.brand); else { setBrand('其他'); $('brandOther').value = c.brand; } }
      if (c.saved){ setYn('wrap', !!c.wrap); setYn('mod', !!c.mod); }
      $('wrapNote').value = c.wrapNote || ''; $('modNote').value = c.modNote || '';
    }
    if (bound){
      $('title').textContent = '更新禮車車卡'; $('lead').textContent = '確認或修改下面的資料，改好按送出。';
      $('name').readOnly = true; goLabel = '送出更新'; $('go').textContent = goLabel;
    }
    renderPhotos();
    $('loading').hidden = true; $('f').hidden = false;
  }).catch(function(err){ fatal(err && err.message ? err.message : '讀取失敗，請關掉後重新開啟'); });
})();
</script>
</body>
</html>
