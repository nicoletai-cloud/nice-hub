<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>司機車卡｜好好禮車</title>
<style>
:root{--bg:#f8f5f0;--surface:#fff;--fg:#2f2a24;--muted:#7a7066;--line:#e4dbce;--accent:#8a6d43;--accent-ink:#fff;--warn:#b4532a;--warn-soft:#fbeee6;--ok:#2f7d4f;--ok-soft:#e8f4ec}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--surface:#26221e;--fg:#f1ebe3;--muted:#b3a899;--line:#3b352e;--accent:#c9a46b;--accent-ink:#1d1a17;--warn:#f0a07a;--warn-soft:#3a2a22;--ok:#7fc79a;--ok-soft:#1f3328}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}
.brand{color:var(--accent);font-weight:700;letter-spacing:.08em;font-size:15px}
h1{font-size:24px;margin:2px 0 4px}
.lead{color:var(--muted);margin:0 0 18px;font-size:15px}
form{display:grid;gap:16px}
.field{display:grid;gap:6px}
label{font-weight:600}
label small{font-weight:400;color:var(--muted);margin-left:6px}
input{font:inherit;font-size:18px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
input[readonly]{background:transparent;color:var(--muted)}
input.bad{border-color:var(--warn);background:var(--warn-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:38px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.err{color:var(--warn);font-size:14px;min-height:0}
.hint{font-size:15px;color:var(--ok);min-height:0}
.hint.warn{color:var(--warn)}
.sec{font-weight:700;font-size:18px;border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
.sec small{display:block;font-weight:400;font-size:14px;color:var(--muted)}
button.go{font:inherit;font-weight:700;font-size:18px;color:var(--accent-ink);background:var(--accent);border:0;border-radius:12px;min-height:52px;width:100%;cursor:pointer;margin-top:4px}
button.go:disabled{opacity:.6}
.note{border-radius:12px;padding:14px 16px;white-space:pre-line}
#ownLine{white-space:normal}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.state{text-align:center;color:var(--muted);padding:48px 0}
.done{text-align:center;padding:36px 0}
.done .big{font-size:52px;line-height:1}
.done h2{margin:10px 0 6px}
.done p{color:var(--muted);margin:0 0 20px;white-space:pre-line}
.drow,.ditem{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.drow .lb,.ditem .lb{flex:1;font-weight:600}
.drow .st,.ditem .st{font-size:14px;color:var(--muted)}
.drow .st.ok,.ditem .st.ok{color:var(--ok)}
.pick{font:inherit;font-size:15px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 14px;min-height:38px;cursor:pointer;white-space:nowrap}
.pick:disabled{opacity:.5}
.del{font:inherit;font-size:14px;border:0;background:transparent;color:var(--warn);cursor:pointer;padding:6px}
.ck{display:flex;gap:8px;align-items:center;font-weight:400;margin:6px 0}
.ck input{width:22px;height:22px;min-height:0}
.dates{display:grid;gap:10px}
.dates label{display:grid;gap:4px}
.dates small{font-weight:400;color:var(--muted)}
.tnote{color:var(--muted);font-size:13px;margin:10px 0 0}
button.go.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:10px}
#docs .sec{margin-top:18px}
[hidden]{display:none!important}
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
</head>
<body>
<div class="wrap">
  <div class="brand">好好禮車 司機回報平台</div>
  <h1 id="title">填寫車卡</h1>
  <p class="lead" id="lead">填好按送出就完成綁定，之後接單不用再填資料。</p>
  <div class="note warn" id="ownLine" style="margin:0 0 16px">⚠️ 請用<b>駕駛本人</b>的 LINE 開啟並填寫。<br>這個 LINE 會綁定成司機帳號，之後的派車通知都會傳到這裡，請不要用家人或車行的 LINE 代填。</div>

  <div class="state" id="loading">讀取中…</div>
  <div class="note warn" id="fatal" hidden></div>

  <form id="f" hidden novalidate>
    <div class="field">
      <label for="name">姓名<small>請填駕照上的全名</small></label>
      <input id="name" autocomplete="name" maxlength="20" placeholder="例：王聰明" required>
      <div class="err" id="e-name"></div>
    </div>
    <div class="field">
      <label for="phone">手機號碼</label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="12" placeholder="09xxxxxxxx" required>
      <div class="err" id="e-phone"></div>
    </div>
    <div class="field">
      <label for="plate">車牌<small>例：RED-7380</small></label>
      <input id="plate" autocapitalize="characters" maxlength="10" required>
      <div class="err" id="e-plate"></div>
    </div>
    <div class="field">
      <label>廠牌</label>
      <div class="chips" id="brandChips">
        <button type="button" class="chip">Tesla</button><button type="button" class="chip">Benz</button><button type="button" class="chip">BMW</button><button type="button" class="chip">Lexus</button><button type="button" class="chip">Toyota</button><button type="button" class="chip">其他</button>
      </div>
      <input id="brandOther" maxlength="15" placeholder="其他進口車廠牌（例：Volvo）" hidden>
      <div class="err" id="e-brand"></div>
    </div>
    <div class="field">
      <label for="car">車款</label>
      <input id="car" maxlength="25" placeholder="例：Model Y" required>
      <div class="err" id="e-car"></div>
    </div>
    <div class="field">
      <label for="color">車色</label>
      <input id="color" maxlength="10" placeholder="例：白色" required>
      <div class="err" id="e-color"></div>
    </div>
    <div class="field">
      <label for="seats">座位數<small>含司機</small></label>
      <div class="chips" data-for="seats">
        <button type="button" class="chip">5</button><button type="button" class="chip">6</button><button type="button" class="chip">7</button><button type="button" class="chip">9</button>
      </div>
      <input id="seats" type="number" inputmode="numeric" min="2" max="19" placeholder="例：5" required>
      <div class="err" id="e-seats"></div>
    </div>
    <div class="sec">匯款帳號<small>車資匯款用，只有好好禮車看得到</small></div>
    <div class="field">
      <label for="bankCode">銀行代碼<small>3 碼，例：822</small></label>
      <input id="bankCode" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="例：822" required>
      <div class="hint" id="bankName"></div>
      <input type="hidden" id="bank">
      <div class="err" id="e-bankCode"></div>
    </div>
    <div class="field">
      <label for="acct">帳號</label>
      <input id="acct" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="只填數字" required>
      <div class="err" id="e-acct"></div>
    </div>
    <div class="field">
      <label for="holder">戶名<small>和姓名一樣可以不填</small></label>
      <input id="holder" maxlength="20">
      <div class="err" id="e-holder"></div>
    </div>
    <div class="note warn" id="srvErr" hidden></div>
    <button type="submit" class="go" id="go">送出車卡</button>
  </form>

  <div id="docs" hidden>
    <div class="note ok" id="dOk" hidden>✅ 證件都齊了，謝謝！換新證件時再回來更新就好。</div>
    <div class="note warn" id="dMiss" hidden></div>
    <div class="sec">駕照<small>正面一張</small></div>
    <div class="drow" data-k="licF"></div>
    <div class="sec">行照<small>正面一張</small></div>
    <div class="drow" data-k="regF"></div>
    <div class="sec">保險單<small>需包含強制險及任意險，最多 5 個檔案</small></div>
    <div class="dmulti" data-k="ins"></div>
    <div class="sec">車輛外觀照片<small>1～3 張，看得到車頭和車牌</small></div>
    <div class="dmulti" data-k="car"></div>
    <div class="note warn" id="dErr" hidden></div>
    <button type="button" class="go" id="dSave">儲存</button>
    <p class="tnote">證件只存在好好禮車的雲端資料夾，只用來確認合法接案。</p>
  </div>

  <div class="done" id="done" hidden>
    <div class="big">✅</div>
    <h2 id="doneTitle">綁定完成</h2>
    <p id="doneMsg"></p>
    <button type="button" class="go" id="toDocs" hidden>下一步：上傳證件</button>
    <button type="button" class="go ghost" id="close">回到聊天室</button>
  </div>
</div>
<script>
(function(){
  var BOT = 'https://script.google.com/macros/s/AKfycbwoKk13j5YOtkA5cTh3FtvECekYm0uMBPsid1H--kB7bhUVpDFvSnSA0iTzCfc8IT11_Q/exec';
  var $ = function(id){ return document.getElementById(id); };
  var idToken = '', disp = '', bound = false, goLabel = '送出車卡';
  var FIELDS = ['name','phone','plate','car','color','seats','bankCode','acct','holder'];
  var BANKS = {'004':'臺灣銀行','005':'土地銀行','006':'合作金庫','007':'第一銀行','008':'華南銀行','009':'彰化銀行','011':'上海商銀','012':'台北富邦','013':'國泰世華','016':'高雄銀行','017':'兆豐銀行','021':'花旗（台灣）','048':'王道銀行','050':'臺灣企銀','052':'渣打銀行','053':'台中銀行','054':'京城銀行','081':'滙豐（台灣）','101':'瑞興銀行','102':'華泰銀行','103':'新光銀行','108':'陽信銀行','118':'板信銀行','147':'三信銀行','700':'中華郵政','803':'聯邦銀行','805':'遠東銀行','806':'元大銀行','807':'永豐銀行','808':'玉山銀行','809':'凱基銀行','810':'星展（台灣）','812':'台新銀行','816':'安泰銀行','822':'中國信託','823':'將來銀行','824':'連線銀行（LINE Bank）','826':'樂天銀行'};

  function fatal(msg){ $('loading').hidden = true; $('f').hidden = true; $('fatal').hidden = false; $('fatal').textContent = msg; }
  function post(body){
    return fetch(BOT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function(r){ return r.json(); });
  }

  // 快速選項：點了帶入欄位，再點一次取消
  // 廠牌：Tesla / Benz / BMW / Lexus / 其他（自己填）
  var BRANDS = ['Tesla', 'Benz', 'BMW', 'Lexus', 'Toyota'], brand = '';
  function setBrand(b){
    brand = b;
    $('brandChips').querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', String(c.textContent === b)); });
    $('brandOther').hidden = b !== '其他';
    $('e-brand').textContent = ''; $('brandOther').classList.remove('bad');
  }
  $('brandChips').addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if (!c) return;
    setBrand(c.textContent);
    if (brand === '其他') $('brandOther').focus();
  });
  $('brandOther').addEventListener('input', function(){ $('e-brand').textContent = ''; $('brandOther').classList.remove('bad'); });
  function brandText(){ return brand === '其他' ? val('brandOther') : brand; }
  // 舊資料的車款拆回廠牌＋車款
  function splitCar(car){
    car = String(car || '').trim();
    var alias = [['Tesla', /^(tesla|特斯拉)\s*/i], ['Benz', /^(mercedes[-\s]?benz|benz|賓士)\s*/i], ['BMW', /^(bmw|寶馬)\s*/i], ['Lexus', /^(lexus|凌志)\s*/i], ['Toyota', /^(toyota|豐田)\s*/i]];
    for (var i = 0; i < alias.length; i++){ if (alias[i][1].test(car)) return { brand: alias[i][0], model: car.replace(alias[i][1], '') }; }
    if (/^model\s?[3sxy]\b/i.test(car)) return { brand: 'Tesla', model: car };
    if (/^(vito|v\s?class)/i.test(car)) return { brand: 'Benz', model: car };
    if (/^lm\b/i.test(car)) return { brand: 'Lexus', model: car };
    if (/^(alphard|granvia|sienta|previa)\b/i.test(car)) return { brand: 'Toyota', model: car };
    var m = car.match(/^([A-Za-z\u4e00-\u9fa5-]+)\s+(.+)$/);
    return m ? { brand: '其他', other: m[1], model: m[2] } : { brand: '', model: car };
  }
  document.querySelectorAll('.chips[data-for]').forEach(function(box){
    var input = $(box.getAttribute('data-for'));
    function sync(){ box.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', String(c.textContent === input.value.trim())); }); }
    box.addEventListener('click', function(e){
      var c = e.target.closest('.chip'); if (!c) return;
      input.value = (c.getAttribute('aria-pressed') === 'true') ? '' : c.textContent;
      input.classList.remove('bad'); $('e-' + input.id).textContent = '';
      sync(); input.dispatchEvent(new Event('input'));
    });
    input.addEventListener('input', sync);
    input._sync = sync;
  });

  function val(id){ return $(id).value.trim(); }
  function check(){
    var errs = {};
    var phone = val('phone').replace(/[^0-9]/g, '');
    if (!val('name')) errs.name = '請填駕照上的全名';
    else if (!/^[\u4e00-\u9fa5·．]{2,6}$|^[A-Za-z][A-Za-z.'-]*(\s+[A-Za-z][A-Za-z.'-]*)+$/.test(val('name')) || /^[小阿老][\u4e00-\u9fa5]$/.test(val('name'))) errs.name = '請填駕照上的全名，不要填暱稱（例：王聰明）';
    if (!/^09\d{8}$/.test(phone)) errs.phone = '請填 10 碼手機號碼（09 開頭）';
    if (val('plate').replace(/[^A-Za-z0-9]/g, '').length < 4) errs.plate = '請填完整車牌';
    if (!brand) errs.brand = '請選廠牌';
    else if (brand === '其他' && !val('brandOther')) { errs.brand = '請填其他進口車廠牌'; $('brandOther').classList.add('bad'); }
    if (!val('car')) errs.car = '請填車款';
    if (!val('color')) errs.color = '請選或填車色';
    if (!/^([2-9]|1[0-9])$/.test(val('seats'))) errs.seats = '請填 2～19 的數字';
    if (!/^\d{3}$/.test(val('bankCode'))) errs.bankCode = '請填 3 碼銀行代碼（例：822）';
    if (!/^\d{10,16}$/.test(val('acct').replace(/[\s-]/g, ''))) errs.acct = '帳號請填 10～16 位數字';
    FIELDS.forEach(function(k){
      $(k).classList.toggle('bad', !!errs[k]); $('e-' + k).textContent = errs[k] || '';
    });
    if (errs.brand) $('e-brand').textContent = errs.brand;
    var first = Object.keys(errs)[0];
    if (first === 'brand'){ (brand === '其他' ? $('brandOther') : $('brandChips')).scrollIntoView({ block: 'center' }); return false; }
    if (first) $(first).focus();
    return !first;
  }
  FIELDS.forEach(function(k){
    $(k).addEventListener('input', function(){ $(k).classList.remove('bad'); $('e-' + k).textContent = ''; });
  });
  function showBank(){
    var c = val('bankCode').replace(/[^0-9]/g, ''), n = BANKS[c] || '', h = $('bankName');
    if (c !== $('bankCode').value) $('bankCode').value = c;
    $('bank').value = c.length === 3 ? (n ? c + ' ' + n : c) : '';
    h.className = 'hint' + (c.length === 3 && !n ? ' warn' : '');
    h.textContent = c.length < 3 ? '' : (n ? '✓ ' + n : '清單裡找不到這個代碼，請再確認一次（農會、信用合作社可照填）');
  }
  $('bankCode').addEventListener('input', showBank);
  $('plate').addEventListener('blur', function(){ $('plate').value = $('plate').value.toUpperCase(); });

  $('f').addEventListener('submit', function(e){
    e.preventDefault();
    $('srvErr').hidden = true;
    if (!check()) return;
    $('go').disabled = true; $('go').textContent = '送出中…';
    post({ action: 'drvLiff', op: 'save', idToken: idToken, disp: disp,
      card: { name: val('name'), phone: val('phone'), plate: val('plate').toUpperCase(), car: (brandText() + ' ' + val('car')).trim(), color: val('color'), seats: val('seats'),
        bank: $('bank').value, acct: val('acct').replace(/[\s-]/g, ''), holder: val('holder') } })
      .then(function(j){
        if (!j || !j.ok) throw new Error((j && j.error) || '送出失敗，請再試一次');
        if (!j.done){ $('srvErr').hidden = false; $('srvErr').textContent = (j.msg || '資料有誤，請檢查後再送出').split('\n')[0]; return; }
        $('f').hidden = true; $('done').hidden = false; $('ownLine').hidden = true;
        $('doneTitle').textContent = bound ? '車卡已更新' : '綁定完成';
        $('doneMsg').textContent = bound ? '資料已更新，謝謝！' : '之後接單不用再填資料。\n車子或電話有變，再從選單按「綁定車卡」修改就好。\n\n接下來請上傳駕照、行照、保險單和車輛照片。';
        $('toDocs').hidden = false;
        try { if (liff.isInClient()) liff.sendMessages([{ type: 'text', text: bound ? '✅ 資料已用表單更新' : '✅ 資料已用表單送出' }]).catch(function(){}); } catch (x) {}
      })
      .catch(function(err){ $('srvErr').hidden = false; $('srvErr').textContent = err.message || String(err); })
      .then(function(){ $('go').disabled = false; $('go').textContent = goLabel; });
  });
  $('close').addEventListener('click', function(){ try { liff.closeWindow(); } catch (x) {} });

  /* ---------- 證件上傳 ---------- */
  var DK = { licF: '駕照正面', regF: '行照正面', ins: '保險單', car: '車輛外觀' }, DMAX = { ins: 5, car: 3 };
  var dFiles = {}, dBusy = false;
  function md(t){ var d = new Date(+t); return (d.getMonth() + 1) + '/' + d.getDate(); }
  function pickBtn(k, label){ return '<label class="pick"><input type="file" accept="image/*,application/pdf" data-up="' + k + '" hidden>' + label + '</label>'; }
  function renderDocs(j){
    dFiles = j.files || {};
    document.querySelectorAll('.drow').forEach(function(el){
      var k = el.getAttribute('data-k'), f = (dFiles[k] || [])[0];
      el.innerHTML = '<span class="lb">' + DK[k] + '</span><span class="st' + (f ? ' ok' : '') + '">' + (f ? '✓ 已上傳 ' + md(f.at) : '未上傳') + '</span>' + pickBtn(k, f ? '重新上傳' : '拍照／選檔');
    });
    document.querySelectorAll('.dmulti').forEach(function(el){
      var k = el.getAttribute('data-k'), L = dFiles[k] || [];
      el.innerHTML = L.map(function(f, i){ return '<div class="ditem"><span class="lb">' + DK[k] + ' ' + (i + 1) + '</span><span class="st ok">✓ ' + md(f.at) + '</span><button type="button" class="del" data-del="' + k + '|' + f.id + '">刪除</button></div>'; }).join('') +
        (L.length < DMAX[k] ? '<div class="ditem"><span class="lb">' + (L.length ? '再加一個' : DK[k]) + '</span><span class="st">' + L.length + ' / ' + DMAX[k] + '</span>' + pickBtn(k, '拍照／選檔') + '</div>' : '');
    });
    var d = j.docs || {};
    $('dOk').hidden = !d.ok; $('dMiss').hidden = !!d.ok || !(d.miss || []).length;
    $('dMiss').textContent = '還缺：' + (d.miss || []).join('、');
  }
  function shrink(file){
    return new Promise(function(res){
      if (!/^image\//.test(file.type) || /heic|heif/i.test(file.type)) return res(file);
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function(){ var M = 1800, w = img.naturalWidth, h = img.naturalHeight, r = Math.min(1, M / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * r); c.height = Math.round(h * r); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); c.toBlob(function(b){ res(b && b.size < file.size ? b : file); }, 'image/jpeg', 0.82); };
      img.onerror = function(){ URL.revokeObjectURL(url); res(file); };
      img.src = url;
    });
  }
  function b64(blob){ return new Promise(function(res, rej){ var fr = new FileReader(); fr.onload = function(){ res(String(fr.result).split(',')[1] || ''); }; fr.onerror = rej; fr.readAsDataURL(blob); }); }
  function dErr(m){ $('dErr').hidden = !m; $('dErr').textContent = m || ''; }
  document.addEventListener('change', function(e){
    var k = e.target.getAttribute && e.target.getAttribute('data-up'); if (!k || !e.target.files || !e.target.files[0]) return;
    var file = e.target.files[0]; e.target.value = '';
    if (dBusy) return; dBusy = true; dErr('');
    var lab = e.target.parentNode; lab.lastChild.textContent = '上傳中…';
    shrink(file).then(function(b){ if (b.size > 9 * 1024 * 1024) throw new Error('檔案太大（超過 9MB），請改拍照上傳');
      var mime = b.type || file.type || 'image/jpeg'; return b64(b).then(function(s){ return post({ action: 'drvLiff', op: 'upload', idToken: idToken, kind: k, mime: mime, b64: s }); }); })
      .then(function(j){ if (!j || !j.ok) throw new Error((j && j.error) || '上傳失敗，請再試一次'); renderDocs(j); })
      .catch(function(err){ dErr(err.message || String(err)); lab.lastChild.textContent = '再試一次'; })
      .then(function(){ dBusy = false; });
  });
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('[data-del]'); if (!b || dBusy) return;
    var p = b.getAttribute('data-del').split('|'); dBusy = true; b.textContent = '刪除中…';
    post({ action: 'drvLiff', op: 'docdel', idToken: idToken, kind: p[0], id: p[1] }).then(function(j){ if (!j || !j.ok) throw new Error((j && j.error) || '刪除失敗'); renderDocs(j); })
      .catch(function(err){ dErr(err.message || String(err)); }).then(function(){ dBusy = false; });
  });
  $('dSave').addEventListener('click', function(){
    if (dBusy) return; dErr('');
    dBusy = true; $('dSave').textContent = '儲存中，請稍等…';
    post({ action: 'drvLiff', op: 'docsave', idToken: idToken })
      .then(function(j){ if (!j || !j.ok) throw new Error((j && j.error) || '儲存失敗'); renderDocs(j);
        if (j.docs && j.docs.ok){ $('docs').hidden = true; $('done').hidden = false; $('toDocs').hidden = true; $('doneTitle').textContent = '證件已上傳完成';
          $('doneMsg').textContent = '謝謝！證件換新時，再傳「上傳證件」更新就好。'; try { if (liff.isInClient()) liff.sendMessages([{ type: 'text', text: '✅ 證件已上傳完成' }]).catch(function(){}); } catch (x) {} }
        else { window.scrollTo(0, 0); } })
      .catch(function(err){ dErr(err.message || String(err)); }).then(function(){ dBusy = false; $('dSave').textContent = '儲存'; });
  });
  function openDocs(){
    $('ownLine').hidden = true; $('f').hidden = true; $('done').hidden = true; $('loading').hidden = false;
    $('title').textContent = '上傳證件'; $('lead').textContent = '用手機直接拍照就可以，每一項上傳後會顯示 ✓。';
    return post({ action: 'drvLiff', op: 'docs', idToken: idToken }).then(function(j){
      if (!j || !j.ok) throw new Error((j && j.error) || '讀取失敗，請關掉後重新開啟');
      renderDocs(j); $('loading').hidden = true; $('docs').hidden = false;
    }).catch(function(err){ fatal(err && err.message ? err.message : '讀取失敗'); });
  }
  $('toDocs').addEventListener('click', openDocs);
  function wantDocs(){
    var q = location.search || '';
    try { var st = new URLSearchParams(q).get('liff.state'); if (st) q += '&' + decodeURIComponent(st).replace(/^\?/, ''); } catch (x) {}
    return /(^|[?&])p=docs\b/.test(q);
  }

  fetch(BOT + '?action=drvLiffCfg').then(function(r){ return r.json(); }).then(function(c){
    if (!c || !c.liffId) throw new Error('車卡表單還沒設定完成，請回聊天室用文字格式填寫。');
    return liff.init({ liffId: c.liffId });
  }).then(function(){
    if (!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return null; }
    idToken = liff.getIDToken() || '';
    return liff.getProfile().then(function(p){ disp = p.displayName || ''; }, function(){}).then(function(){
      if (wantDocs()) return openDocs().then(function(){ return null; });
      return post({ action: 'drvLiff', op: 'load', idToken: idToken });
    });
  }).then(function(j){
    if (j === null) return;
    if (!j || !j.ok) throw new Error((j && j.error) || '讀取失敗，請關掉後重新開啟');
    bound = !!j.bound;
    if (bound && j.card){
      $('title').textContent = '更新車卡';
      $('lead').textContent = '確認或修改下面的資料，改好按送出。';
      j.card.bankCode = String(j.card.bank || '').slice(0, 3);
      var sc = splitCar(j.card.car); j.card.car = sc.model;
      if (sc.brand) setBrand(sc.brand); if (sc.other) $('brandOther').value = sc.other;
      FIELDS.forEach(function(k){ $(k).value = j.card[k] || ''; if ($(k)._sync) $(k)._sync(); });
      showBank();
      $('name').readOnly = true;
      goLabel = '送出更新'; $('go').textContent = goLabel;
    }
    $('loading').hidden = true; $('f').hidden = false;
  }).catch(function(err){ fatal(err && err.message ? err.message : '讀取失敗，請關掉後重新開啟'); });
})();
</script>
</body>
</html>
