<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>好好禮車 入口</title>
<meta name="theme-color" content="#A9793B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23A9793B'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23FFFFFF' font-family='PingFang TC,Noto Sans TC,sans-serif'%3E%E5%A5%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* NWC UI v1 · 與禮車／機場工具共用的色票與字型 */
:root{
  --bg:#FBF6F1; --surface:#FFFFFF; --surface-2:#F6ECE1; --fg:#3A2E24; --muted:#75665A; --line:#E8DBCB;
  --accent:#A9793B; --accent-ink:#FFFFFF; --accent-soft:#F3E6D6; --ok:#4F7A4A; --warn:#B5652B; --warn-soft:#F7E4D3;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-label:"Montserrat","Noto Sans TC","PingFang TC",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1916; --surface:#26211D; --surface-2:#2F2823; --fg:#EFE4DA; --muted:#A8988A; --line:#3D342D;
  --accent:#CFA163; --accent-ink:#1D1916; --accent-soft:#3A2E22; --ok:#8DB886; --warn:#E09A62; --warn-soft:#3F2C1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1916; --surface:#26211D; --surface-2:#2F2823; --fg:#EFE4DA; --muted:#A8988A; --line:#3D342D;
  --accent:#CFA163; --accent-ink:#1D1916; --accent-soft:#3A2E22; --ok:#8DB886; --warn:#E09A62; --warn-soft:#3F2C1D; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:18px;line-height:1.55}
.wrap{max-width:1000px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right))}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding-bottom:14px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-size:26px;color:var(--accent);letter-spacing:.06em;font-weight:700}
.brand span{font-family:var(--f-label);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.today{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border-top:1px solid var(--line);padding-top:12px;margin-bottom:18px;font-size:15px;color:var(--muted)}
.bar .st{flex:1;min-width:160px}
.bar .st.err{color:var(--warn)}
.btn{font:500 15px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,a.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:720px){.tools{grid-template-columns:minmax(0,1fr)}}
a.tool{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;color:inherit;text-decoration:none;transition:border-color .15s}
a.tool:hover{border-color:var(--accent)}
.tool .kicker{font-family:var(--f-label);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.tool h2{margin:2px 0 0;font-size:28px;font-weight:700;letter-spacing:.04em}
.tool p{margin:4px 0 0;font-size:15px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:520px){.stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface-2);border-radius:8px;padding:10px 12px;min-width:0}
.stat .n{display:block;font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.stat.hot{background:var(--warn-soft)}
.stat.hot .n{color:var(--warn)}
.stat.na .n{color:var(--muted);font-weight:500}
.go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-weight:500;color:var(--accent);font-size:17px;border-top:1px solid var(--line);padding-top:12px}
.note{margin-top:18px;font-size:15px;color:var(--muted)}
.note a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){a.tool{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>好好禮車</b><span>Dispatch Hub</span></div>
    <div class="today" id="today"></div>
  </header>
  <div class="bar">
    <span class="st" id="status">正在讀取今日待辦…</span>
    <button type="button" class="btn" id="refresh">重新整理</button>
  </div>

  <main class="tools">
    <a class="tool" id="toolAir" href="https://nicoletai-cloud.github.io/nice-wedding-car/">
      <div>
        <div class="kicker">Airport Transfer</div>
        <h2>機場接送</h2>
        <p>報價、包車、找司機、訂單派車、收據</p>
      </div>
      <div class="stats" aria-label="機場接送今日狀況">
        <div class="stat na" id="airUn"><span class="n">–</span><span class="l">待指派司機</span></div>
        <div class="stat na" id="airT0"><span class="n">–</span><span class="l">今天出車</span></div>
        <div class="stat na" id="airT1"><span class="n">–</span><span class="l">明天出車</span></div>
      </div>
      <div class="go"><span>進入機場接送</span><span aria-hidden="true">→</span></div>
    </a>

    <a class="tool" id="toolWed" href="https://nicoletai-cloud.github.io/nice-wedding-procession/">
      <div>
        <div class="kicker">Wedding Dispatch</div>
        <h2>結婚禮車</h2>
        <p>報價、合約、找司機、車隊流程、memo</p>
      </div>
      <div class="stats four" aria-label="結婚禮車今日狀況">
        <div class="stat na" id="wedTodo"><span class="n">–</span><span class="l">待辦事項</span></div>
        <div class="stat na" id="wedNo"><span class="n">–</span><span class="l">缺司機</span></div>
        <div class="stat na" id="wedT0"><span class="n">–</span><span class="l">今天出車</span></div>
        <div class="stat na" id="wedT1"><span class="n">–</span><span class="l">明天出車</span></div>
      </div>
      <div class="go"><span>進入結婚禮車</span><span aria-hidden="true">→</span></div>
    </a>
  </main>

  <p class="note" id="note" hidden>數量來自「好好禮車機器人」。第一次使用請先到機場工具的「收據」分頁，在「派車機器人連線」貼上網址與金鑰，這裡就會自動顯示。</p>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var KEY_URL='hhlc_bot_url', KEY_TOKEN='hhlc_bot_token', KEY_CACHE='nwc_hub_counts';
  function ls(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function botUrl(){var u=String(ls(KEY_URL)||'').trim(); if(!u) return ''; u=u.split('?')[0].split('#')[0]; return /^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/.test(u)?u:''}

  var WD='日一二三四五六', now=new Date();
  $('today').textContent=(now.getMonth()+1)+'/'+now.getDate()+'（週'+WD[now.getDay()]+'）';

  function setStat(id,v,hotWhenPositive){
    var el=$(id), n=el.querySelector('.n');
    el.classList.remove('hot','na');
    if(typeof v!=='number'){el.classList.add('na'); n.textContent='–'; return}
    n.textContent=String(v);
    if(hotWhenPositive&&v>0) el.classList.add('hot');
  }
  function render(c){
    var a=(c&&c.air)||{}, w=(c&&c.wedding)||{};
    setStat('airUn',a.err?null:a.unassigned,true); setStat('airT0',a.err?null:a.today); setStat('airT1',a.err?null:a.tomorrow);
    setStat('wedTodo',w.err?null:w.todo,true); setStat('wedNo',w.err?null:w.nodrv,true); setStat('wedT0',w.err?null:w.today); setStat('wedT1',w.err?null:w.tomorrow);
  }
  function hhmm(ts){var d=new Date(ts);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
  function status(msg,err){var s=$('status'); s.textContent=msg; s.classList.toggle('err',!!err)}

  var cached=null; try{cached=JSON.parse(ls(KEY_CACHE)||'null')}catch(e){}
  if(cached&&cached.data){render(cached.data)}

  var busy=false;
  function load(){
    if(busy) return;
    var url=botUrl(), token=String(ls(KEY_TOKEN)||'').trim();
    if(!url||!token){
      $('note').hidden=false;
      status(cached&&cached.ts?'尚未連線機器人，顯示的是 '+hhmm(cached.ts)+' 的舊數字':'尚未連線機器人，還看不到今日待辦數量',true);
      return;
    }
    $('note').hidden=true; busy=true; $('refresh').disabled=true; status('正在讀取今日待辦…');
    var ctl=('AbortController' in window)?new AbortController():null, timer=setTimeout(function(){ctl&&ctl.abort()},25000);
    fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:token,action:'todayCounts'}),signal:ctl?ctl.signal:undefined,cache:'no-store'})
      .then(function(r){return r.json()})
      .then(function(j){
        if(!j||!j.ok){throw new Error(j&&j.error?j.error:'機器人沒有回應數量')}
        render(j); lsSet(KEY_CACHE,JSON.stringify({ts:Date.now(),data:j}));
        cached={ts:Date.now(),data:j};
        status('已更新，'+hhmm(Date.now()));
      })
      .catch(function(e){
        var m=String(e&&e.message||e);
        if(/金鑰|權杖|token/i.test(m)) m='金鑰不正確，請到機場工具重新貼上金鑰';
        else if(/abort/i.test(m)) m='連線逾時，請稍後再按一次重新整理';
        else if(/unknown|未知|action/i.test(m)) m='機器人還不支援數量查詢，請確認已部署最新版本';
        else m='讀取失敗，請確認網路後再按一次重新整理';
        status((cached&&cached.ts?m+'（顯示 '+hhmm(cached.ts)+' 的舊數字）':m),true);
      })
      .then(function(){clearTimeout(timer);busy=false;$('refresh').disabled=false});
  }
  $('refresh').addEventListener('click',load);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&(!cached||Date.now()-cached.ts>120000)) load()});
  setInterval(function(){if(!document.hidden) load()},300000);
  load();
})();
</script>
</body>
</html>
